name: Build and Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.0

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ hashFiles('src/Ncore/*.cpp', 'src/Ncore/*.h') }}
          restore-keys: |
            ccache-${{ matrix.os }}-

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ENABLE: "cpython-prerelease cpython-freethreading"
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
          CIBW_ENVIRONMENT_LINUX: "CCACHE_DIR=/project/.ccache PATH=/usr/lib/ccache:$PATH"
          CIBW_BEFORE_BUILD_LINUX: "yum install -y ccache || apt-get install -y ccache || apk add ccache"
          CIBW_ENVIRONMENT_WINDOWS: "CCACHE_DIR=.\\.ccache"
          CIBW_BEFORE_BUILD_WINDOWS: "choco install ccache -y"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build SDist
      run: pipx run build --sdist
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
